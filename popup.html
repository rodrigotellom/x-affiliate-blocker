<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --fg: #0f1419; --muted: #536471; --border: #eff3f4; --accent: #f4212e; --chip: #f7f9f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --fg: #e7e9ea; --muted: #71767b; --border: #2f3336; --chip: #16181c; }
  }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 15px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  label.row { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
  form { display: flex; gap: 6px; }
  input[type=text] { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--chip); color: var(--fg); }
  button { padding: 5px 10px; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); padding: 2px 6px; }
  ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 160px; overflow: auto; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border-radius: 6px; background: var(--chip); margin-bottom: 4px; }
  .muted { color: var(--muted); }
  .warn { color: var(--accent); }
  a { color: inherit; }
</style>
</head>
<body>
  <section>
    <h1>X Affiliate Blocker</h1>
    <div class="muted" id="stats"></div>
  </section>

  <section>
    <h2>Companies</h2>
    <form id="add">
      <input type="text" id="company" placeholder="@OpenAI or OpenAI" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="companies"></ul>
  </section>

  <section>
    <h2>Settings</h2>
    <label class="row"><input type="checkbox" id="blockMode"> Actually block (otherwise just hide)</label>
    <label class="row"><input type="checkbox" id="skipFollowing"> Skip people I follow</label>
    <label class="row"><input type="checkbox" id="paused"> Pause</label>
    <div class="muted warn" id="blockWarn" hidden>Blocks go out one every few seconds. Mass-blocking can get your account rate-limited.</div>
  </section>

  <section>
    <h2>Organizations seen</h2>
    <ul id="seen"></ul>
    <div class="muted" style="margin-top:6px">Tip: open <b>x.com/&lt;company&gt;/affiliates</b> and scroll to catch everyone at once.</div>
  </section>

  <section>
    <h2>Recently blocked</h2>
    <ul id="blocked"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
